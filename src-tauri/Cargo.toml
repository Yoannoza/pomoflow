[package]
name = "pomoflow"
version = "0.1.0"
description = "PomoFlow - Premium Pomodoro Timer"
authors = ["Yoannoza"]
license = "MIT"
repository = "https://github.com/Yoannoza/pomoflow"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-http = "2"
